spring.application.name=paragrein-logistics-backend
server.port=8080

# Extension point: replace the username and password with local MySQL credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/paragrein_logistics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate will automatically update the database schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security note: use a long localhost secret; replace before any non-local deployment.
app.jwt.secret=paragrein-localhost-jwt-secret-change-before-real-deployment
app.jwt.expiration-ms=86400000

# Local Papercut SMTP only. No authentication, TLS, or external mail service is used.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=no-reply@paragrein.local
app.frontend.reset-password-url=http://localhost:5173/reset-password
app.password-reset.expiry-minutes=30

# Password reset expiry times (milliseconds)
# 60000   = 1 minute
# 300000  = 5 minutes
# 1800000 = 30 minutes
# 3600000 = 1 hour

